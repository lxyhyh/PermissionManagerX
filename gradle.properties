# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# ⚠️ 2026-08-16 沙盒 6.1GB 内存 + 无 Swap → 锁定总 JVM 占用不超 4GB：
#    - 堆 2800m（够用）+ G1GC（并发标记整理，内存更平滑，不会突然 Full GC 卡死）
#    - MetaSpace 固定 1g（Gradle/Kotlin 插件多 classloader）
#    - CodeCache 240m（JIT 编译热点）
#    - Kotlin daemon off（直接在 Gradle JVM 内跑编译器，少开一个 JVM 省 3g）
#    - 不强制系统代理？→ 恰恰相反！！沙盒唯一外网出口是本地代理 127.0.0.1:18080！！
#      → 不用代理 = 直连 = Connect timed out！！ 必须强制 HTTP 走代理！！
org.gradle.jvmargs=-Xmx2800m -XX:MaxMetaspaceSize=1g -XX:ReservedCodeCacheSize=240m -XX:+UseG1GC -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp/pmx_gradle_oom.hprof -XX:SoftRefLRUPolicyMSPerMB=0 -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true -Dkotlin.compiler.execution.strategy=in-process -Dhttp.proxyHost=127.0.0.1 -Dhttp.proxyPort=18080 -Dhttps.proxyHost=127.0.0.1 -Dhttps.proxyPort=18080 -Dhttp.nonProxyHosts=localhost|127.0.0.1|*.svc|*.cluster.local|::1

# 避免环境里默认 Java 25（Kotlin/AGP 都解析不了 25.0.2 版本号），强制锁定 JDK17
# 注意：必须是 JDK 17 的实际绝对路径，由环境搭建阶段生成
org.gradle.java.home=/root/.local/share/mise/installs/java/17.0.2
org.gradle.daemon=false

# 单 worker / 单线程，小内存下不争抢；parallel 彻底关
org.gradle.workers.max=2
org.gradle.parallel=false
org.gradle.internal.publish.checksums.insecure=true

# ⚠️ 沙盒 IPv6 路由全黑洞（Network is unreachable），强制 JVM / Gradle / 子进程 全部走 IPv4
#   systemProp.xxx 是 Gradle 官方推荐：所有 forked JVM（kotlin、aapt2、r8、dex 子进程）都会继承
systemProp.java.net.preferIPv4Stack=true
systemProp.java.net.preferIPv4Addresses=true
systemProp.sun.net.inetaddr.ttl=300

# ⚠️ 沙盒唯一外网出口：本地 HTTP(S) 代理 127.0.0.1:18080（必须走！否则直连所有 Maven 节点 Connect timed out！）
#   - systemProp.http.proxyHost 是 Gradle 官方推荐：所有内置 HTTP transport + forked JVM 子进程 全部继承
#   - nonProxyHosts 匹配：localhost / .svc / .cluster.local （内部服务直连不走代理，避免代理 Loop）
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=18080
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=18080
systemProp.http.nonProxyHosts=localhost|127.0.0.1|*.svc|*.cluster.local|::1
systemProp.https.nonProxyHosts=localhost|127.0.0.1|*.svc|*.cluster.local|::1

# ⚠️ 沙盒网络出口偶发 IP 段波动（某段时间特定 CDN 节点 timeout）→ 短超时+快速失败+切下一个仓库
systemProp.org.gradle.internal.http.connectionTimeout=10000
systemProp.org.gradle.internal.http.socketTimeout=60000
systemProp.org.gradle.internal.http.retry.count=3

# 关 Kotlin daemon，让编译器直接在 Gradle JVM 内跑，少开一个吃内存的 JVM
kotlin.daemon.enabled=false

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app"s APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true

# Automatically convert third-party libraries to use AndroidX
#android.enableJetifier=true

# Improve Compose preview rendering performance.
#org.gradle.configuration-cache=true

# Show deprecated Gradle features and obsolete APIs
org.gradle.warning.mode=all
android.debug.obsoleteApi=true
