import java.nio.file.Paths

apply plugin: 'apk-conventions'

final NDK_VER = '28.2.13676358'

android {
    namespace = 'com.mirfatif.permissionmanagerx'

    defaultConfig {
        applicationId namespace

        versionCode libs.versions.app.code.get().toInteger()
        versionName libs.versions.app.name.get()

        // Flavor-independent and BuildType-independent BuildConfig.APPLICATION_ID
        buildConfigField 'String', 'APP_ID', '"' + namespace + '"'

        versionNameSuffix '-foss'
    }

    // S-0b 签名配置（仅本机安装测试，非正式发布）
    // - debug: 沿用系统默认 ~/.android/debug.keystore（AGP 自动，此处显式写出方便对齐）
    // - release: ~/.android/pmx_release.jks（新生成 RSA 2048，有效期 10000 天；SHA256=96:29:FB:72）
    signingConfigs {
        debug {
            storeFile file(System.getenv('HOME') + '/.android/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            storeFile file(System.getenv('HOME') + '/.android/pmx_release.jks')
            storePassword 'pmx2026test'
            keyAlias 'pmx_release'
            keyPassword 'pmx2026test'
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix = '.debug'
            versionNameSuffix = '-debug'
            signingConfig = signingConfigs.debug
        }

        // S-0d 轻量 release buildType（用于安装测试，不跑 R8/ProGuard/资源压缩=沿用 debug 成功路径，避免 daemon OOM）
        //  - applicationId = 纯 namespace（无 .debug 后缀 = 和商店/正式版同包名，可覆盖安装）
        //  - signingConfig = release 独立 keystore pmx_release.jks（SHA256=96:29:FB:72）
        //  - minifyEnabled=false / shrinkResources=false / isCoreLibraryDesugaringEnabled 沿用全局 true（debug 也开=已在 assembleDebug 验证过 desugar 成功）
        releaseNoR8 {
            // 与 release buildType 相同的 sourceSet/依赖处理：使用 release 产物的变体命名（ReleaseNoR8），但不做混淆
            initWith(buildTypes.release)
            // 关键：子模块 :priv_library / :priv_daemon / :hidden_apis 只有 debug/release 两 buildType
            // 当本模块 releaseNoR8 去消费它们的 variant 时，找不到对应 buildType → 回退匹配 release（生产代码）
            matchingFallbacks = ['release']
            // 覆盖 apk-conventions 插件给 release 设置的 minifyEnabled=true / shrinkResources=true
            minifyEnabled = false
            shrinkResources = false
            postprocessing.obfuscate = false
            // 去掉 debug 后缀 → 纯 applicationId=com.mirfatif.permissionmanagerx（用于真实安装覆盖测试）
            applicationIdSuffix = ''
            // defaultConfig 已加 versionNameSuffix '-foss'，这里不要再重复（否则会变成 -foss-foss）
            versionNameSuffix = ''
            signingConfig = signingConfigs.release
            // 匹配 debug/默认：让 lint/debuggable 行为保持发布前测试安全
            debuggable = false
            isDefault = false
            // 签名包（v1+v2）已在 signingConfigs.release 配好
        }

        release {
            postprocessing.obfuscate = false
            signingConfig = signingConfigs.release
            // S-4a：开启真 release R8 混淆 + 资源压缩（apk-conventions 默认 isMinifyEnabled=true / isShrinkResources=true，我们显式写 true 对齐）
            //   - proguardFiles = proguard-android-optimize.txt（AGP 自带） + app/proguard-rules.pro（项目自定义）
            //   - shrinkResources=true 前提：minifyEnabled=true（先混淆，再根据混淆后的引用图删无用资源，顺序 AGP 保证）
            //   - 如混淆后崩溃/缺资源：补 keep 规则 或 res/raw/keep.xml 保留资源
            minifyEnabled = true
            shrinkResources = true
        }
    }

    packagingOptions {
        jniLibs {
            // Due to android:extractNativeLibs set to 'true' in AndroidManifest.
            useLegacyPackaging = true
        }

        // Exclude large files.
        resources.excludes.add('org/bouncycastle/pqc/crypto/picnic/lowmcL1.bin.properties')
        resources.excludes.add('org/bouncycastle/pqc/crypto/picnic/lowmcL3.bin.properties')
        resources.excludes.add('org/bouncycastle/pqc/crypto/picnic/lowmcL5.bin.properties')
    }
}

configurations {
    configureEach {
        // To avoid duplicate class version conflict.
        exclude group: 'androidx.lifecycle', module: 'lifecycle-viewmodel-ktx'
    }
}

dependencies {
    implementation project(path: ':priv_library')
    runtimeOnly project(path: ':priv_daemon')

    implementation libs.libadb.android
    // To generate X509Certificate
    implementation libs.sun.security.android
    // For conscrypt
    implementation libs.hiddenapibypass

    implementation libs.androidx.appcompat
    implementation libs.androidx.recyclerview
    implementation libs.androidx.swiperefreshlayout
    implementation libs.androidx.preference
    implementation libs.androidx.browser
    implementation libs.androidx.room.runtime
    implementation libs.androidx.security.crypto
    implementation libs.androidx.webkit
    annotationProcessor libs.androidx.room.compiler

    // For SnackBar and NavigationView. Also includes CoordinatorLayout
    implementation libs.material

    // To handle hyperlink onClick in TextView
    implementation libs.better.link.movement.method

    // To use Iterables for splitting Collections
    implementation(libs.guava)

    // Let's behave responsibly
    debugImplementation libs.leakcanary.android
}

tasks.register('buildNative', Exec) {
    def props = new Properties()
    props.load(new FileInputStream(new File(rootDir, "local.properties")))
    def ndkDir = new File(props.get("sdk.dir").toString(), "ndk/" + NDK_VER)

    if (!ndkDir.exists()) {
        throw new GradleException('NDK ' + NDK_VER + ' not installed')
    }

    environment 'ANDROID_NDK', ndkDir.absolutePath
    workingDir rootDir.absolutePath + "/native"
    commandLine './build_native.sh'

    doLast {
        if (executionResult.get().exitValue != 0) {
            throw new GradleException('buildNative failed')
        }
    }
}

afterEvaluate {
    for (String build : new String[]{'Debug', 'Release'}) {
        tasks.named('merge' + build + 'JniLibFolders').configure {
            dependsOn('buildNative')
            mustRunAfter('buildNative')
        }
    }
}

clean.doLast {
    Paths.get(projectDir.absolutePath, 'src/main/jniLibs').deleteDir()
}

preBuild.doFirst {
    // Re-merge the assets and jniLibs source sets.
    for (String dir in new String[]{'assets', 'merged_jni_libs'}) {
        Paths.get(projectDir.absolutePath, 'build/intermediates/' + dir).deleteDir()
    }
}
